name: Rolling Release

# PRs are previews. Integration pushes publish all three verified channels.
on:
  push:
    branches: [rebuild/main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the three verified release channels
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sdk-${{ github.event_name == 'workflow_dispatch' && !inputs.publish && 'verification' || 'releases' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Each channel's kit, plus the configurations for the VARIANTS, DEBUG and RA-VARIANTS bundles.
        target:
          - {edition: korium, configuration: standard}
          - {edition: ra, configuration: standard}
          - {edition: incebtion, configuration: standard}
          - {edition: ra_incebtion, configuration: standard}
          - {edition: korium, configuration: pademu0}
          - {edition: korium, configuration: ds5}
          - {edition: korium, configuration: extras}
          - {edition: korium, configuration: extras_ds5}
          - {edition: korium, configuration: dtl}
          - {edition: korium, configuration: diag}
          - {edition: korium, configuration: debug}
          - {edition: korium, configuration: debug_uart}
          - {edition: korium, configuration: ingame_debug}
          - {edition: korium, configuration: iopcore_debug}
          - {edition: korium, configuration: eesio_debug}
          - {edition: korium, configuration: ingame_debug_uart}
          - {edition: korium, configuration: iopcore_debug_uart}
          - {edition: korium, configuration: ingamediag}
          - {edition: ra, configuration: pademu0}
    env:
      PS2BUILD_HOME: ${{ github.workspace }}/.ps2dev
      PS2DEV_INSTALL_DIR: ${{ github.workspace }}/.ps2dev
      PS2BUILD_TOOLCHAIN: gcc
      GODEBUG: http2client=0
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ps2dev
          key: release-ps2build-${{ runner.os }}-${{ matrix.target.edition }}-${{ matrix.target.configuration }}-${{ github.run_id }}
          restore-keys: |
            release-ps2build-${{ runner.os }}-${{ matrix.target.edition }}-
            ps2dev-${{ runner.os }}-gcc-v2-
      - name: Install ps2build and its only SDK
        id: sdk1
        continue-on-error: true
        uses: techwritescode/setup-sdk@master
        with:
          ps2dev: ${{ github.workspace }}/.ps2dev
      # git.techwritescode.dev has multi-minute HTTP 521 outages; one retry 45 s later was not enough
      # (rebuild/main 894dca3). Same three attempts as flavours.yml and ps2build.yml.
      - name: Retry SDK setup after a transient download failure
        if: steps.sdk1.outcome == 'failure'
        run: sleep 45
      - name: Install ps2build (retry 1)
        id: sdk2
        if: steps.sdk1.outcome == 'failure'
        continue-on-error: true
        uses: techwritescode/setup-sdk@master
        with:
          ps2dev: ${{ github.workspace }}/.ps2dev
      - name: Wait before retrying the SDK setup again
        if: steps.sdk1.outcome == 'failure' && steps.sdk2.outcome == 'failure'
        run: sleep 90
      - name: Install ps2build (retry 2)
        if: steps.sdk1.outcome == 'failure' && steps.sdk2.outcome == 'failure'
        uses: techwritescode/setup-sdk@master
        with:
          ps2dev: ${{ github.workspace }}/.ps2dev
      - name: Install matching audio packages and fetch assets
        run: |
          sh tools/install_ps2build.sh
          python tools/assets.py fetch
          python tools/assets.py lang
      - name: Build the edition (GCC)
        shell: bash
        run: |
          mkdir -p build
          python tools/build_edition.py '${{ matrix.target.edition }}' --configuration '${{ matrix.target.configuration }}' 2>&1 | tee build/edition.log
      - name: Retain the configuration build
        if: matrix.target.configuration != 'standard'
        uses: actions/upload-artifact@v4
        with:
          name: variant-${{ matrix.target.edition }}-${{ matrix.target.configuration }}
          path: dist/configurations/${{ matrix.target.edition }}-${{ matrix.target.configuration }}-gcc/
          if-no-files-found: error
          retention-days: 14
      - name: Download the official companion core
        if: matrix.target.configuration == 'standard'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          mkdir -p build/companion
          gh release download latest --repo rickgaiser/neutrino --dir build/companion --pattern '*.7z'
      - name: Package and verify the full install kit
        if: matrix.target.configuration == 'standard'
        shell: bash
        run: |
          mapfile -t cores < <(find build/companion -maxdepth 1 -name 'neutrino_*.7z' -type f)
          test "${#cores[@]}" -eq 1
          python tools/package_edition.py '${{ matrix.target.edition }}' --neutrino-archive "${cores[0]}"
      - name: Retain verified release candidate
        if: matrix.target.configuration == 'standard'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target.edition }}
          path: dist/releases/${{ matrix.target.edition }}/
          if-no-files-found: error
          retention-days: 14
      - name: Retain compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-log-${{ matrix.target.edition }}-${{ matrix.target.configuration }}
          path: build/edition.log

  publish:
    needs: build
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && github.ref == 'refs/heads/rebuild/main' && github.repository == 'NathanNeurotic/RiptOPL'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/downloaded
      - uses: actions/download-artifact@v4
        with:
          pattern: variant-*
          path: dist/downloaded
      - name: Verify and publish the three channels
        run: python tools/publish_editions.py dist/downloaded
