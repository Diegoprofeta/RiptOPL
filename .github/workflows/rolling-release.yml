name: Rolling Release

# Preview first. Publication is an explicit dispatch from the integration branch.
on:
  push:
    branches: [rebuild/main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the three verified release channels
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sdk-releases-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish }}

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        edition: [korium, ra, incebtion]
    env:
      PS2BUILD_HOME: ${{ github.workspace }}/.ps2dev
      PS2DEV_INSTALL_DIR: ${{ github.workspace }}/.ps2dev
      PS2BUILD_TOOLCHAIN: gcc
      GODEBUG: http2client=0
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ps2dev
          key: release-ps2build-${{ runner.os }}-${{ matrix.edition }}-${{ github.run_id }}
          restore-keys: |
            release-ps2build-${{ runner.os }}-${{ matrix.edition }}-
            ps2dev-${{ runner.os }}-gcc-v2-
      - name: Install ps2build and its only SDK
        id: sdk1
        continue-on-error: true
        uses: techwritescode/setup-sdk@master
        with:
          ps2dev: ${{ github.workspace }}/.ps2dev
      - name: Retry SDK setup after a transient download failure
        if: steps.sdk1.outcome == 'failure'
        run: sleep 45
      - name: Install ps2build (retry)
        if: steps.sdk1.outcome == 'failure'
        uses: techwritescode/setup-sdk@master
        with:
          ps2dev: ${{ github.workspace }}/.ps2dev
      - name: Install matching audio packages and fetch assets
        run: |
          sh tools/install_ps2build.sh
          python tools/assets.py fetch
          python tools/assets.py lang
      - name: Build the edition (GCC)
        shell: bash
        run: |
          mkdir -p build
          python tools/build_edition.py '${{ matrix.edition }}' 2>&1 | tee build/edition.log
      - name: Download the official companion core
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          mkdir -p build/companion
          gh release download latest --repo rickgaiser/neutrino --dir build/companion --pattern '*.7z'
      - name: Package and verify the full install kit
        shell: bash
        run: |
          mapfile -t cores < <(find build/companion -maxdepth 1 -name 'neutrino_*.7z' -type f)
          test "${#cores[@]}" -eq 1
          python tools/package_edition.py '${{ matrix.edition }}' --neutrino-archive "${cores[0]}"
      - name: Retain verified release candidate
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.edition }}
          path: dist/releases/${{ matrix.edition }}/
          if-no-files-found: error
          retention-days: 14
      - name: Retain compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-log-${{ matrix.edition }}
          path: build/edition.log

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/rebuild/main' && github.repository == 'NathanNeurotic/RiptOPL'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/downloaded
      - name: Verify and publish the three channels
        run: python tools/publish_editions.py dist/downloaded
