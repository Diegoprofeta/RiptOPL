  "HINT_VCD_FIRST_DISC": "ສະແດງແຕ່ແຜ່ນທີ 1 (Disc 1) ຂອງເກມ PS1 ແບບຫຼາຍແຜ່ນໃນລາຍການອຸປະກອນ (ຮູບແບບ POPSLoader). ເຊື່ອງໄຟລ໌ທີ່ຕັ້ງຊື່ວ່າ (Disc 2), (CD 2), ແລະ ອື່ນໆ. ແຜ່ນທັງໝົດຍັງຄົງຢູ່ໃນກາດເພື່ອສະຫຼັບໃນເກມ; ລາຍການທີ່ມັກ (Favorites) ຈະບໍ່ຖືກກັ່ນຕອງ."
