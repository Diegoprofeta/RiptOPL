  IGR_USB_DRIVERS_PROMPT: مسار IGR على USB، لكن %s يفتقد USBD.IRX وUSBHDFSD.IRX، اللذين يحتاجهما الجهاز للوصول إلى USB بعد إعادة الضبط داخل اللعبة. بدونهما يسقط IGR إلى متصفح PS2. نسخ برامج تشغيل RiptOPL إلى هناك الآن؟ تحمّل FMCB وOpenTuna والثغرات الأخرى هذه الملفات أيضاً وقد تتصرف معها بشكل مختلف. لا تُستبدل الملفات الموجودة أبداً. لذاكرات USB بنظام FAT32 فقط.
  IGR_USB_DRIVERS_FAILED: تعذّر نسخ برامج تشغيل USB إلى %s (البطاقة ممتلئة أو غير قابلة للكتابة). سيسقط IGR إلى متصفح PS2.
