  HINT_EMBER_CONTROLLER: 'وضع وحدة تحكم Ember: Auto أو Analog أو D2A. الأفضل عادةً ضبطه لكل لعبة (المثلث > إعدادات لعبة Ember)، وهو ما يتقدّم على هذا.'
