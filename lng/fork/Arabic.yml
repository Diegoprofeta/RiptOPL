  EMBER_TIMING: توقيت Ember
  HINT_EMBER_TIMING: 'توقيت فيديو Ember: Auto يتبع منطقة القرص، وNTSC يفرض 60 هرتز، وPAL يفرض 50 هرتز. يُكتب في EMBER/settings.txt على الجهاز المُشغَّل.'
