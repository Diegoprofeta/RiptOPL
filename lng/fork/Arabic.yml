  HINT_CFG_TITLES: يعرض العنوان من ملف CFG لكل لعبة بدلاً من اسم ملفها، ويرتّب حسبه. يقرأ كل ملفات CFG عند تحديث القائمة، لذا تُحمّل القوائم أبطأ. للعرض فقط.
  LOGOART: صورة الشعار
  HINT_LOGOART: يعرض شعار اللعبة (<ID>_LGO) عندما تستخدمه السمة. الإيقاف يخفي أيضاً صورته الافتراضية، لكنه يُبقي الأغلفة وصور الأقراص والخلفيات.
