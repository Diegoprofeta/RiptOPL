  NEUTRINO_BD_NO_DEVICE_NUMBER: نظام ملفات Neutrino مضبوط على bd، لكن هذا الجهاز لم يبلّغ رقم جهازه قط، لذا لا يمكن توجيه Neutrino إليه. اضبط نظام ملفات Neutrino لهذه اللعبة على Auto أو exfat.
