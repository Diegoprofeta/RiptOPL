  VMC_REPLACE_REQUIRES_DELETE: تغيير حجم VMC سيمحو ملفات حفظه. انسخ VMC الموجود احتياطياً واستخدم الحذف قبل إنشاء حجم جديد.
  VMC_CREATE_FAILED: تعذّر إنشاء VMC. افحص الجهاز والاتصال وصلاحية الكتابة. لم تُستبدل ملفات الحفظ الموجودة.
  UDPFS_IP_CONFLICT: جهاز آخر على شبكتك يستخدم عنوان IP الخاص بجهاز PS2 هذا، لذا تذهب ردود خادم UDPFS إليه. اضبط عنوان PS2 IP مختلفاً في إعدادات الشبكة.
